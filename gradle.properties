# Project-wide Gradle settings.

# AndroidX libraries are a replacement for the older Support libraries.
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables copy-paced-of-build-cache for faster builds
org.gradle.caching=true

# JVM memory for the Gradle daemon (fixes OOM in mergeExtDexDebug / D8)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Run tasks in parallel where possible
org.gradle.parallel=true

# Give the Kotlin daemon its own heap too (kapt/kotlinc can OOM separately from Gradle daemon)
kotlin.daemon.jvmargs=-Xmx2048m